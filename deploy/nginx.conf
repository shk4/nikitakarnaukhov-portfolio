server {
    listen 80;
    server_name nikitakarnaukhov.ru www.nikitakarnaukhov.ru;
    root /var/www/nikitakarnaukhov;
    index index.html;
    charset utf-8;
    autoindex off;

    # Client-side navigation back to the homepage requests /.rsc.
    location = /.rsc { rewrite ^ /index.rsc last; }

    # These payloads are required for animated client-side navigation.
    location ~ \.rsc$ {
        types { text/x-component rsc; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
